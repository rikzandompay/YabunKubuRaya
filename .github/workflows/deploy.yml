name: Deploy to Production VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 43.173.30.73
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "===> Pulling latest changes from Git..."
            cd /var/www/yabun
            git pull origin main

            echo "===> Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "===> Running database migrations..."
            php artisan migrate --force

            echo "===> Refreshing application cache..."
            php artisan optimize:clear
            php artisan optimize

            echo "===> Ensuring correct storage & database permissions..."
            sudo chown -R www-data:www-data storage database bootstrap/cache
            sudo chmod -R 775 storage database bootstrap/cache

            echo "===> Reloading PHP 8.4 FPM..."
            sudo systemctl reload php8.4-fpm

            echo "===> Deployment finished successfully! Website is up to date."
